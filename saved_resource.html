<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MUJAHID 2.3</title>
<link href="./css2" rel="stylesheet">
<style>
:root{--bg:#f5f7f9;--card:#fff;--ink:#16222e;--mute:#64727f;--line:#dde3e8;--pri:#0f6e66;--pri-ink:#fff;--soft:#e3f1ef;--danger:#b3261e;
--s-draft:#8a6d00;--s-draft-bg:#fff3c4;--s-conf:#0b5cad;--s-conf-bg:#dcebfb;--s-done:#17692f;--s-done-bg:#dbf1e0;--s-can:#8c2b2b;--s-can-bg:#f9dede;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161c;--card:#18222b;--ink:#e8eef3;--mute:#93a3b1;--line:#2b3946;--pri:#3cb8ad;--pri-ink:#06201d;--soft:#173532;--danger:#f2938d;
--s-draft:#f0d067;--s-draft-bg:#3a3210;--s-conf:#8fc4f5;--s-conf-bg:#13304d;--s-done:#86d99b;--s-done-bg:#14351f;--s-can:#f2a3a3;--s-can-bg:#3d1c1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161c;--card:#18222b;--ink:#e8eef3;--mute:#93a3b1;--line:#2b3946;--pri:#3cb8ad;--pri-ink:#06201d;--soft:#173532;--danger:#f2938d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;text-decoration:none;color:var(--ink)}
.brand b{font-size:20px;letter-spacing:.04em}.brand small{color:var(--mute);font-size:12px}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav a{padding:7px 14px;border-radius:8px;text-decoration:none;color:var(--mute);font-weight:500;white-space:nowrap}
nav a.on{background:var(--soft);color:var(--pri)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;color:var(--mute);padding:5px 12px;font:inherit;cursor:pointer}
.lang button.on{background:var(--pri);color:var(--pri-ink)}
main{max-width:1100px;margin:auto;padding:20px 16px 60px}
.crumb{color:var(--mute);font-size:13px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.stat span{color:var(--mute);font-size:13px;display:block}.stat b{font-size:26px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:21px;margin:0}.head p{margin:2px 0 0;color:var(--mute);font-size:14px}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--line)}.btn.del{background:none;color:var(--danger);border:1px solid var(--danger)}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.lang button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.count{color:var(--mute);font-size:13px;margin:6px 2px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mute);font-weight:500;background:var(--bg)}tr:last-child td{border-bottom:0}
td a{color:var(--pri);font-weight:600;text-decoration:none}
.tag{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:500;white-space:nowrap}

let DB=null,pushT=0;const synced={ord:new Map()};
function attachDb(db){DB=db;
return new Promise(res=>{let n=0;const seen={};const mark=k=>{if(!seen[k]){seen[k]=1;if(++n===3){clearTimeout(to);res()}}};
const rer=()=>{if(n<3)return;const a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;route()};
const to=setTimeout(res,6000);
DB.doc("app/catalog").onSnapshot(x=>{const d=x.data();if(d){S.customers=d.customers||[];S.items=d.items||[];synced.cat=JSON.stringify([S.customers,S.items])}mark("c");rer()},()=>mark("c"));
DB.doc("app/accounts").onSnapshot(x=>{const d=x.data();if(d&&d.users&&d.users.length){S.users=d.users;synced.acc=JSON.stringify(S.users)}mark("a");rer()},()=>mark("a"));
DB.collection("orders").onSnapshot(q=>{S.orders=q.docs.map(x=>x.data()).sort((a,b)=>a.no-b.no);synced.ord=new Map(S.orders.map(o=>[o.no,JSON.stringify(o)]));mark("o");rer()},()=>mark("o"));
})}
function pushDb(){if(!DB)return;clearTimeout(pushT);pushT=setTimeout(async()=>{try{
const cat=JSON.stringify([S.customers,S.items]);
if(synced.cat!==undefined&&cat!==synced.cat){synced.cat=cat;await DB.doc("app/catalog").set({customers:S.customers,items:S.items})}
const acc=JSON.stringify(S.users);
if(synced.acc!==undefined&&acc!==synced.acc){synced.acc=acc;await DB.doc("app/accounts").set({users:S.users})}
const cur=new Map(S.orders.map(o=>[o.no,JSON.stringify(o)]));
for(const [no,j] of cur)if(synced.ord.get(no)!==j){synced.ord.set(no,j);await DB.doc("orders/o"+no).set(JSON.parse(j))}
for(const no of [...synced.ord.keys()])if(!cur.has(no)){synced.ord.delete(no);await DB.doc("orders/o"+no).delete()}
}catch(e){console.error(e);alert(t("syncBad"))}},300)}
async function boot(){
if(typeof claude!=="undefined"){$("#app").innerHTML='<div class="empty">…</div>';
let db=null;try{db=await Promise.race([claude.use("db"),new Promise(r=>setTimeout(()=>r(null),6000))])}catch(e){}
if(db)await attachDb(db)}
route()}
function route(){
const {h}=shell();
if(!ME){draft=null;viewLogin();return}
if((h==="users"&&ME.role!=="admin")||((h==="items"||h==="customers")&&ME.role==="rep")){location.hash="orders";return}
if(h==="users"){viewUsers();return}
if(h==="new")viewNew();else if(h.startsWith("order-"))viewOrder(+h.slice(6));
else if(h==="items")viewDir("items");else if(h==="customers")viewDir("customers");else viewOrders();
if(h!=="new")draft=null;
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();route()});
addEventListener("hashchange",route);boot();
